; Dedicated PHP-FPM pool: its own system user, its own socket, restricted settings.
; Installed by provision.sh as /etc/php/<version>/fpm/pool.d/password-manager.conf.
[password-manager]
user = pm-app
group = pm-app
listen = /run/php/password-manager.sock
listen.owner = caddy
listen.group = caddy
listen.mode = 0660

pm = ondemand
pm.max_children = 10
pm.process_idle_timeout = 30s
pm.max_requests = 500

; Mitigation for CVE-2026-109619 and CVE-2026-115560 (ADR-017).
php_admin_flag[session.upload_progress.enabled] = off
php_admin_flag[expose_php] = off
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /srv/password-manager/shared/var/log/php-error.log
php_admin_value[open_basedir] = /srv/password-manager/:/tmp/:/usr/share/php/
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec
php_admin_value[memory_limit] = 256M
; A vault key rotation sends every entry at once.
php_admin_value[post_max_size] = 32M
php_admin_value[upload_max_filesize] = 2M
php_admin_value[max_execution_time] = 30
php_admin_value[opcache.validate_timestamps] = 0
