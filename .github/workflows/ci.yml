name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP ${{ matrix.php }} / ${{ matrix.db }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '8.3', db: mysql }
          - { php: '8.4', db: mysql }
          - { php: '8.5', db: mysql }
          - { php: '8.3', db: mariadb }
    services:
      database:
        image: ${{ matrix.db == 'mysql' && 'mysql:8.0' || 'mariadb:11.4' }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MARIADB_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="${{ matrix.db == 'mysql' && 'mysqladmin ping -h 127.0.0.1 -uroot -proot' || 'healthcheck.sh --connect --innodb_initialized' }}"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/pm_vault?serverVersion=${{ matrix.db == 'mysql' && '8.0.40' || '11.4.0-MariaDB' }}&charset=utf8mb4
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ctype, iconv, mbstring, openssl, pdo_mysql, sodium
          coverage: none
          tools: composer:v2
          ini-values: session.upload_progress.enabled=0
      - name: Check PHP security level (2026-10-21 fixes, CVE mitigations)
        run: php tools/check-php-platform.php
      - run: composer validate --strict
      - run: composer install --no-interaction --no-progress --prefer-dist
      - name: Create the test database from the migrations
        run: |
          php bin/console doctrine:database:create --env=test
          php bin/console doctrine:migrations:migrate --env=test --no-interaction
          php bin/console doctrine:schema:validate --env=test
      - run: composer check
      - run: composer audit

  frontend:
    name: Front-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm audit --omit=dev

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: [php, frontend]
    services:
      database:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/pm_vault?serverVersion=8.0.40&charset=utf8mb4
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: ctype, iconv, mbstring, openssl, pdo_mysql, sodium
          coverage: none
          tools: composer:v2
          ini-values: session.upload_progress.enabled=0
      - run: php tools/check-php-platform.php
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            var/log/
          retention-days: 7

  release:
    name: Release archive
    runs-on: ubuntu-latest
    needs: [php, frontend, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: ctype, iconv, mbstring, openssl, pdo_mysql, sodium
          coverage: none
          tools: composer:v2
          ini-values: session.upload_progress.enabled=0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: bash tools/package-release.sh "$(git describe --tags --always)"
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: dist/
          retention-days: 30
