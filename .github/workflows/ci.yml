name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ctype, iconv, mbstring, openssl, pdo_mysql, sodium
          coverage: none
          tools: composer:v2
          ini-values: session.upload_progress.enabled=0
      - name: Check PHP security level (2026-10-21 fixes, CVE mitigations)
        run: php tools/check-php-platform.php
      - run: composer validate --strict
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: composer check
      - run: composer audit

  frontend:
    name: Front-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm audit --omit=dev

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: [php, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: ctype, iconv, mbstring, openssl, pdo_mysql, sodium
          coverage: none
          tools: composer:v2
          ini-values: session.upload_progress.enabled=0
      - run: php tools/check-php-platform.php
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
